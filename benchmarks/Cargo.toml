[package]
name = "dinoco_benchmarks"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Benchmarks, allocation reports and SQL golden corpus for the Dinoco runtime."

[dependencies]
anyhow = { workspace = true }
dinoco = { workspace = true }
dinoco_engine = { workspace = true, features = ["sqlite", "postgres", "mysql"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["async_tokio", "cargo_bench_support"] }

[[bench]]
name = "runtime"
harness = false
