[workspace]
members = [
	"crates/dinoco",
	"crates/dinoco_cli",
	"crates/dinoco_codegen",
	"crates/dinoco_compiler",
	"crates/dinoco_engine",
	"crates/dinoco_formatter",
	"vscode",
	"crates/dinoco_derives",
	"tests",
	"examples/axum",
	"examples/actix-web",
	"examples/tower",
	"benchmarks",
]

resolver = "3"

# Inherited by every crate (`version.workspace = true`, ...). A release changes
# the version here and in the internal dependencies below, nowhere else.
[workspace.package]
version = "2.2.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
homepage = "https://dinoco.io"
repository = "https://github.com/dinoco-rs/dinoco"
readme = "crates.md"

[workspace.dependencies]
# The crates of this workspace, published together at the version above.
dinoco = { path = "crates/dinoco", version = "2.2.2" }
dinoco_cli = { path = "crates/dinoco_cli", version = "2.2.2" }
dinoco_codegen = { path = "crates/dinoco_codegen", version = "2.2.2" }
dinoco_compiler = { path = "crates/dinoco_compiler", version = "2.2.2" }
# Exact: generated code calls into this exact version of the runtime.
dinoco_derives = { path = "crates/dinoco_derives", version = "=2.2.2" }
# Without its default features: each member picks the databases it needs.
dinoco_engine = { path = "crates/dinoco_engine", version = "2.2.2", default-features = false }
dinoco_formatter = { path = "crates/dinoco_formatter", version = "2.2.2" }
dinoco_vscode = { path = "vscode", version = "2.2.2" }

# Third-party crates more than one member uses, at one version.
anyhow = "1.0.103"
async-trait = "0.1.89"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
quote = "1.0.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3"
tokio = "1.53"
