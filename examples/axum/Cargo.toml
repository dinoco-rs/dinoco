[package]
name = "dinoco-example-axum"
version = "1.2.7"
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
dinoco = { workspace = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
