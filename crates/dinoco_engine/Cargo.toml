[package]
name = "dinoco_engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Database adapters, query execution, and migration engine components for Dinoco."
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["orm", "database", "sql", "adapters", "migrations"]

[features]
default = ["sqlite", "postgres", "mysql"]
sqlite = ["dep:rusqlite", "dep:deadpool-sqlite"]
postgres = [
	"dep:tokio-postgres",
	"dep:deadpool-postgres",
	"dep:futures-util",
	"dep:tokio-postgres-rustls",
	"dep:rustls",
	"dep:webpki-roots",
]
mysql = ["dep:mysql_async", "dep:mysql_common"]

[dependencies]
tokio = { workspace = true, features = ["rt", "sync"] }

async-trait = { workspace = true }
futures-util = { workspace = true, optional = true }

deadpool-sqlite = { version = "0.14", optional = true }
rusqlite = { version = "0.40.2", optional = true, features = [
	"bundled",
	"chrono",
	"functions",
	"hooks",
	"serde_json",
] }
deadpool-postgres = { version = "0.14.2", optional = true }
tokio-postgres = { version = "0.7", optional = true, features = [
	"with-chrono-0_4",
	"with-serde_json-1",
] }
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1.0", optional = true }
mysql_async = { version = "0.37.1", optional = true, features = ["chrono"] }
mysql_common = { version = "0.37", optional = true, features = ["chrono"] }
anyhow = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde_json = { workspace = true }
serde = { workspace = true }
