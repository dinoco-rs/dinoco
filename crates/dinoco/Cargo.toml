[package]
name = "dinoco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A modern Rust ORM for schema-driven queries, migrations, and database operations."
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["orm", "database", "sql", "migrations", "rust"]

[features]
default = ["sqlite", "postgres", "mysql", "cli"]
sqlite = ["dinoco_engine/sqlite"]
postgres = ["dinoco_engine/postgres"]
mysql = ["dinoco_engine/mysql"]
# The `dinoco` command line tool (`cargo install dinoco`), `TestAmbient` and
# `dinoco::codegen`. The tool works with every database, so it enables all of
# them.
cli = [
	"sqlite",
	"postgres",
	"mysql",
	"dep:dinoco_cli",
	"dep:dinoco_compiler",
	"dep:dinoco_codegen",
	"tokio/macros",
	"tokio/rt-multi-thread",
]

[[bin]]
name = "dinoco"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
dinoco_engine = { workspace = true }
dinoco_derives = { workspace = true }
dinoco_cli = { workspace = true, optional = true }
dinoco_compiler = { workspace = true, optional = true }
dinoco_codegen = { workspace = true, optional = true }

uuid = { version = "1.18.1", features = ["v7"] }

serde = { workspace = true }
serde_json = { workspace = true }

tokio = { workspace = true, features = ["rt", "sync"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
thiserror = "2"
