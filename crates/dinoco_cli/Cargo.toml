[package]
name = "dinoco_cli"
version = "1.1.10"
edition = "2024"
license = "Apache-2.0"
description = "Command-line tools for Dinoco schema setup, code generation, and migrations."
homepage = "https://docs.dinoco.io"
repository = "https://github.com/dinoco-rs/dinoco"
readme = "../../crates.md"
keywords = ["orm", "cli", "database", "migrations", "codegen"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "3"
dotenvy = "0.15"
inquire = "0.7"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.50", features = ["full"] }
dinoco_compiler = { path = "../dinoco_compiler", version = "1.1.10" }
dinoco_formatter = { path = "../dinoco_formatter", version = "1.1.10" }
dinoco_codegen = { path = "../dinoco_codegen", version = "1.1.10" }
dinoco_engine = { path = "../dinoco_engine", version = "1.1.10" }
