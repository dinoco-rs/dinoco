[package]
name = "dinoco_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line tools for Dinoco schema setup, code generation, and migrations."
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["orm", "cli", "database", "migrations", "codegen"]

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
colored = "3"
dotenvy = "0.15"
inquire = "0.9"
sha2 = "0.11"
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
dinoco_compiler = { workspace = true }
dinoco_formatter = { workspace = true }
dinoco_codegen = { workspace = true }
dinoco_engine = { workspace = true, features = ["sqlite", "postgres", "mysql"] }
